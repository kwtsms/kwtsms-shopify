name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22  # 2026-11-04 21:57 +03: was 20 (EOL 2026-04); deps now need >=22.15, CI was red
      - run: npm install
      - run: npm run lint

  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22  # 2026-11-04 21:57 +03: was 20 (EOL 2026-04); deps now need >=22.15, CI was red
      - run: npm install
      - run: npx prisma generate
      - run: npm run typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22  # 2026-11-04 21:57 +03: was 20 (EOL 2026-04); deps now need >=22.15, CI was red
      - run: npm install
      - run: npx prisma generate
      - run: npm run build
